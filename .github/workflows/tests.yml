name: Host tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev libdbus-1-dev python3 python3-dbus python3-gi dbus
      - name: Run C and Python integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate source packaging
        run: /usr/bin/python3 scripts/export-source.py
